server.port=${PORT:8080}
server.address=0.0.0.0

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
server.tomcat.max-http-form-post-size=100MB
server.tomcat.max-swallow-size=100MB

# Banco de dados MariaDB / MySQL. Usuário e senha não possuem fallback para
# evitar que a aplicação use acidentalmente uma conta administrativa do XAMPP.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/DBUNIMED}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}

# Autenticação e sessões
auth.mfa.encryption-key=${AUTH_MFA_ENCRYPTION_KEY:}
auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Strict}
auth.session.idle-minutes=${AUTH_SESSION_IDLE_MINUTES:30}
auth.session.absolute-hours=${AUTH_SESSION_ABSOLUTE_HOURS:8}
auth.login.max-attempts=${AUTH_LOGIN_MAX_ATTEMPTS:5}
auth.login.block-minutes=${AUTH_LOGIN_BLOCK_MINUTES:15}
auth.challenge.minutes=${AUTH_CHALLENGE_MINUTES:5}

# Usado somente quando a tabela usuario está vazia. Remova a senha do ambiente
# depois que o primeiro administrador for criado com sucesso.
auth.bootstrap.admin.name=${AUTH_BOOTSTRAP_ADMIN_NAME:}
auth.bootstrap.admin.login=${AUTH_BOOTSTRAP_ADMIN_LOGIN:}
auth.bootstrap.admin.email=${AUTH_BOOTSTRAP_ADMIN_EMAIL:}
auth.bootstrap.admin.password=${AUTH_BOOTSTRAP_ADMIN_PASSWORD:}

# Integração SGU / PlapiConnect
sgu.api.base-url=${SGU_API_BASE_URL:https://api.lorena.sgusuite.com.br}
sgu.api.key=${SGU_API_KEY:}
sgu.api.key-headers=${SGU_API_KEY_HEADERS:apikey,x-api-key}
sgu.api.procedure-path=${SGU_API_PROCEDURE_PATH:/api/procedure/p_prcssa_dados}
sgu.api.execution-path=${SGU_API_EXECUTION_PATH:/api/procedure/p_prcssa_dados}

# Exportação dos relatórios
sgu.api.export.page-size=${SGU_EXPORT_PAGE_SIZE:1000}
sgu.api.export.max-pages=${SGU_EXPORT_MAX_PAGES:1000}

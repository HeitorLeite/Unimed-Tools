<!-- Navegação persistente; os módulos indisponíveis permanecem visíveis sem liberar acesso. -->
<aside class="sidebar" [class.collapsed]="!open">
  <div class="brand">
    <a class="brand-link" routerLink="/" title="Unimed Tools">
      <span class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 36 36" fill="none">
          <path
            d="M8 25c4-2 6-7 5-16 7 4 10 10 8 17M28 25c-4-2-6-7-5-16-7 4-10 10-8 17"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </span>
      <span class="brand-text" *ngIf="open">
        <strong>Unimed</strong>
        <small>TOOLS</small>
      </span>
    </a>

    <button
      class="toggle-btn"
      type="button"
      (click)="toggleSidebar.emit()"
      [attr.aria-label]="open ? 'Recolher navegação' : 'Expandir navegação'"
      [title]="open ? 'Recolher' : 'Expandir'"
    >
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <path
          *ngIf="open"
          d="m11 4-5 5 5 5"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          *ngIf="!open"
          d="m7 4 5 5-5 5"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
  </div>

  <div class="nav-divider"><span *ngIf="open">Navegação</span></div>

  <nav class="nav-list" aria-label="Navegação principal">
    <a
      class="nav-item home-item"
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      title="Início"
    >
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 20 20" fill="none">
          <path
            d="M3 8.5 10 3l7 5.5V17h-4.5v-5h-5v5H3V8.5Z"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
      <span class="nav-item-text" *ngIf="open">
        <span class="nav-label">Início</span>
        <span class="nav-tag">Visão geral</span>
      </span>
    </a>

    <div class="nav-divider tools-divider"><span *ngIf="open">Ferramentas</span></div>

    <ng-container *ngFor="let item of visibleItems">
      <a
        class="nav-item"
        [class.nav-disabled]="!item.ready"
        [routerLink]="item.ready ? item.route : null"
        [routerLinkActive]="item.ready ? 'active' : ''"
        [title]="item.label + (item.ready ? '' : ' — Em desenvolvimento')"
      >
        <span class="nav-icon" aria-hidden="true">
          <app-tool-icon [name]="item.icon" />
        </span>
        <span class="nav-item-text" *ngIf="open">
          <span class="nav-label">{{ item.label }}</span>
          <span class="nav-tag">{{ item.tag }}</span>
        </span>
        <span class="nav-coming" *ngIf="open && !item.ready">breve</span>
      </a>
    </ng-container>
  </nav>

  <div class="sidebar-footer" *ngIf="user() as currentUser">
    <div class="account-menu" *ngIf="accountOpen() && open" (click)="$event.stopPropagation()">
      <div class="account-menu-heading">
        <strong>{{ currentUser.nome }}</strong
        ><small>{{ currentUser.login }}</small>
      </div>
      <ng-container *ngIf="currentUser.perfil === 'ADMINISTRADOR'">
        <a routerLink="/usuarios" (click)="closeAccount()">Gerenciamento</a>
      </ng-container>
      <button type="button" (click)="logout()">Sair</button>
    </div>

    <button
      class="account-trigger"
      type="button"
      [attr.aria-expanded]="accountOpen()"
      aria-haspopup="menu"
      (click)="toggleAccount($event)"
      [title]="currentUser.nome"
    >
      <span class="account-avatar" aria-hidden="true">{{
        currentUser.nome.charAt(0).toUpperCase()
      }}</span>
      <span class="account-copy" *ngIf="open"
        ><strong>{{ currentUser.nome }}</strong
        ><small>{{
          currentUser.perfil === 'ADMINISTRADOR' ? 'Administrador' : 'Usuário operacional'
        }}</small></span
      >
      <svg *ngIf="open" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path
          d="m4 10 4-4 4 4"
          stroke="currentColor"
          stroke-width="1.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
  </div>
</aside>

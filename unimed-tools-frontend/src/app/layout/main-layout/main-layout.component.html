<!-- Shell compartilhado: navegação, contexto da rota e área de trabalho permanecem separados das regras de negócio. -->
<div class="layout" [class.sidebar-collapsed]="!sidebarOpen()">
  <app-sidebar [open]="sidebarOpen()" (toggleSidebar)="toggleSidebar()" />

  <button
    *ngIf="isMobile() && sidebarOpen()"
    class="sidebar-backdrop"
    type="button"
    aria-label="Fechar navegação"
    (click)="toggleSidebar()"
  ></button>

  <div class="app-frame">
    <header class="workspace-bar">
      <div class="workspace-bar-start">
        <button
          class="mobile-nav-trigger"
          type="button"
          [attr.aria-label]="sidebarOpen() ? 'Fechar navegação' : 'Abrir navegação'"
          (click)="toggleSidebar()"
        >
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path
              d="M3 5.5h14M3 10h14M3 14.5h14"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
          </svg>
        </button>

        <a class="mobile-brand" routerLink="/" aria-label="Ir para o início">
          <span>U</span>
          <strong>Unimed Tools</strong>
        </a>

        <div class="route-context">
          <span>{{ pageContext() }}</span>
          <strong>{{ pageTitle() }}</strong>
        </div>
      </div>

      <div class="workspace-bar-end">
        <span class="environment-pill"><i></i> Ambiente interno</span>
        <span class="workspace-date">Operações · 2026</span>
        <div class="notification-center">
          <button
            class="notification-trigger"
            type="button"
            aria-label="Abrir notificações da aplicação"
            [attr.aria-expanded]="notificationPanelOpen()"
            aria-controls="application-notifications"
            (click)="toggleNotificationPanel()"
          >
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span class="notification-badge" *ngIf="unreadNotifications() > 0">
              {{ unreadNotifications() > 9 ? '9+' : unreadNotifications() }}
            </span>
          </button>

          <section
            *ngIf="notificationPanelOpen()"
            class="notification-panel"
            id="application-notifications"
            aria-label="Atualizações da aplicação"
          >
            <header>
              <div>
                <span>Histórico de versões</span>
                <h2>Atualizações</h2>
              </div>
              <button
                type="button"
                aria-label="Fechar notificações"
                (click)="closeNotificationPanel()"
              >
                ×
              </button>
            </header>

            <div class="notification-list" *ngIf="notifications.length; else noNotifications">
              <article *ngFor="let notification of notifications">
                <div class="notification-meta">
                  <strong>v{{ notification.versao }}</strong>
                  <time [attr.datetime]="notification.publicadaEm">
                    {{ formatNotificationDate(notification.publicadaEm) }}
                  </time>
                </div>
                <h3>{{ notification.titulo }}</h3>
                <p>{{ notification.resumo }}</p>
              </article>
            </div>

            <ng-template #noNotifications>
              <p class="notification-empty">Nenhuma atualização publicada.</p>
            </ng-template>
          </section>
        </div>
      </div>
    </header>

    <main class="main-area" id="main-content">
      <router-outlet />
    </main>
  </div>
</div>

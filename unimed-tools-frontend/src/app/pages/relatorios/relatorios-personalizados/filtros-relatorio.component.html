<div class="campo-grupo" *ngFor="let grupo of gruposAtivos; trackBy: trackGrupo">
  <h3>{{ grupo.nome }}</h3>
  <div class="campos-grid">
    <div class="campo" *ngFor="let filtro of grupo.itens; trackBy: trackCampo">
      <div class="campo-titulo">
        <div class="campo-label">
          <label [for]="'filtro-' + filtro.id">{{ filtro.rotulo }}</label>
          <small *ngIf="filtro.obrigatorio">Obrigatório</small>
        </div>
        <button
          *ngIf="!filtro.obrigatorio"
          type="button"
          class="remove-filter"
          [disabled]="bloqueado"
          [attr.aria-label]="'Remover filtro ' + filtro.rotulo"
          (click)="remover(filtro)"
        >
          Remover
        </button>
      </div>

      <div class="empresa-picker" *ngIf="filtro.tipo === 'empresa'; else filtroPadrao">
        <input
          [id]="'filtro-' + filtro.id"
          type="search"
          placeholder="Buscar empresa pelo nome"
          [(ngModel)]="buscaEmpresa"
          [disabled]="bloqueado"
          autocomplete="off"
        />

        <div class="empresa-chips" *ngIf="empresasSelecionadas.length">
          <button
            type="button"
            *ngFor="let empresa of empresasSelecionadas; trackBy: trackEmpresa"
            [disabled]="bloqueado"
            (click)="alternarEmpresa(empresa, false)"
          >
            {{ empresa.nome }} <span>×</span>
          </button>
        </div>

        <div class="empresa-opcoes" role="group" aria-label="Empresas disponíveis">
          <label *ngFor="let empresa of empresasVisiveis; trackBy: trackEmpresa">
            <input
              type="checkbox"
              [checked]="empresaSelecionada(empresa.id)"
              [disabled]="bloqueado"
              (change)="alternarEmpresa(empresa, $any($event.target).checked)"
            />
            <span>{{ empresa.nome }}</span>
            <small>{{ empresa.codigos.join(', ') }}</small>
          </label>
          <p *ngIf="!empresasVisiveis.length">Nenhuma empresa encontrada.</p>
        </div>

        <small class="field-help">
          Você pode selecionar várias empresas. Os códigos são preenchidos automaticamente.
        </small>
      </div>

      <ng-template #filtroPadrao>
        <select
          *ngIf="filtro.tipo === 'select'; else entrada"
          [id]="'filtro-' + filtro.id"
          [ngModel]="valores[filtro.id]"
          (ngModelChange)="alterar(filtro.id, $event)"
          [disabled]="bloqueado"
        >
          <option value="">Todos</option>
          <option *ngFor="let opcao of filtro.opcoes" [value]="opcao.valor">
            {{ opcao.rotulo }}
          </option>
        </select>

        <ng-template #entrada>
          <input
            [id]="'filtro-' + filtro.id"
            [type]="
              filtro.tipo === 'date'
                ? 'date'
                : filtro.tipo === 'competencia'
                  ? 'month'
                  : 'text'
            "
            [inputMode]="
              filtro.tipo === 'number' || filtro.tipo === 'decimal' ? 'numeric' : 'text'
            "
            [placeholder]="filtro.placeholder"
            [required]="filtro.obrigatorio"
            [disabled]="bloqueado"
            [ngModel]="valores[filtro.id]"
            (ngModelChange)="alterar(filtro.id, $event)"
            autocomplete="off"
          />
        </ng-template>
      </ng-template>
    </div>
  </div>
</div>

<div class="busca-campos">
  <label for="buscar-filtro">Adicionar filtro</label>
  <input
    id="buscar-filtro"
    type="search"
    placeholder="Busque por nome ou categoria"
    [(ngModel)]="busca"
    [disabled]="bloqueado"
  />
  <p>Escolha somente os filtros necessários. Remover um filtro também limpa seu valor.</p>
  <div class="opcoes-campos" aria-label="Filtros disponíveis">
    <button
      type="button"
      *ngFor="let filtro of disponiveis; trackBy: trackCampo"
      [disabled]="bloqueado"
      (click)="adicionar(filtro)"
    >
      <span>+ {{ filtro.rotulo }}</span>
      <small>{{ filtro.grupo }}</small>
    </button>
  </div>
  <p *ngIf="!disponiveis.length" role="status">
    Nenhum filtro disponível para esta busca.
  </p>
</div>
